name: CI
on:
  workflow_dispatch:
  push:
    branches: ['*']
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fork-added tests (must pass)
        working-directory: packages/replicad
        run: pnpm test -- --run __tests__/revolve-angle.test.ts

      - name: Run upstream tests (informational)
        working-directory: packages/replicad
        continue-on-error: true
        run: pnpm test -- --run __tests__/drawing/

      - name: Type check replicad
        working-directory: packages/replicad
        run: pnpm exec tsc --noEmit || true
